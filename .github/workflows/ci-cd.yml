name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# packages: write → lets the docker jobs push to GHCR using the auto-provided
# GITHUB_TOKEN (no separate secret needed). contents: read is the safe default
# for checkout.
permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Backend Lint
  # ──────────────────────────────────────────────────────────
  backend-lint:
    name: ⚙️ Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Check Go formatting
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Unformatted files:$UNFORMATTED"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

  # ──────────────────────────────────────────────────────────
  # Job 2: Frontend Lint
  # ──────────────────────────────────────────────────────────
  frontend-lint:
    name: 🎨 Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node: the cache: 'pnpm' mode shells
      # out to pnpm to locate the store. Version comes from the packageManager
      # field in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings=0

      # -b checks all referenced projects (tsconfig.app.json + tsconfig.node.json)
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npx vite build

      # 15MB as of 2026-10-05: empty-state PNGs were converted to WebP (~9MB
      # saved) and unreferenced legacy backgrounds removed (~5MB). dist measures
      # ~11.4MB. Revisit if og-image/tingting-link-preview (byte-identical) or
      # the pdfmake chunk ever need attention.
      - name: Check bundle size
        working-directory: frontend
        run: |
          DIST_SIZE=$(du -sb dist/ | cut -f1)
          MAX_SIZE=$((15 * 1024 * 1024))
          echo "Bundle size: $(numfmt --to=iec $DIST_SIZE)"
          if [ "$DIST_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Bundle size exceeds 15MB limit"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Job 3: Backend Unit Tests
  # ──────────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run unit tests with coverage
        working-directory: backend
        run: |
          PACKAGES=$(go list ./... | grep -v \
            -e 'internal/app/bootstrap/repositories' \
            -e 'internal/infra/disbursement/ninepay' \
            -e 'internal/infra/events' \
            -e 'internal/infra/persistence')
          go test -race -coverprofile=coverage.out -covermode=atomic $PACKAGES

      - name: Check coverage threshold
        working-directory: backend
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${TOTAL}%"
          if awk "BEGIN {exit !($TOTAL < 30)}"; then
            echo "::warning::Coverage ${TOTAL}% is below 30% threshold"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # Job 4: Frontend Unit Tests
  # ──────────────────────────────────────────────────────────
  frontend-test:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node: the cache: 'pnpm' mode shells
      # out to pnpm to locate the store. Version comes from the packageManager
      # field in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # Job 5: Security Scan
  # ──────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # gosec is a Docker action — working-directory is ignored for `uses` steps.
      # Path must be passed via args instead.
      - name: Run gosec
        uses: securego/gosec@v2.22.3
        with:
          args: '-quiet -no-fail -fmt sarif -out gosec-results.sarif ./backend/...'
        continue-on-error: true

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec
        continue-on-error: true

      # govulncheck blocks on confirmed high-severity vulns
      - name: Go vulnerability check
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # pnpm must be installed before setup-node: the cache: 'pnpm' mode shells
      # out to pnpm to locate the store. Version comes from the packageManager
      # field in frontend/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (for audit)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production deps only)
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high || true

  # ──────────────────────────────────────────────────────────
  # Job 6: Docker Build & Push (Backend)
  # ──────────────────────────────────────────────────────────
  docker-backend:
    name: 🐳 Docker Push (backend)
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR login via the auto-provided GITHUB_TOKEN (no secret to manage).
      # Requires the top-level permissions: { packages: write }.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short SHA tag
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/payroll-backend:latest
            ghcr.io/${{ github.repository_owner }}/payroll-backend:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/payroll-backend:latest
          build-args: BUILDKIT_INLINE_CACHE=1

  # ──────────────────────────────────────────────────────────
  # Job 7: Docker Build & Push (Frontend)
  # ──────────────────────────────────────────────────────────
  docker-frontend:
    name: 🐳 Docker Push (frontend)
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR login via the auto-provided GITHUB_TOKEN (no secret to manage).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short SHA tag
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/payroll-frontend:latest
            ghcr.io/${{ github.repository_owner }}/payroll-frontend:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/payroll-frontend:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_API_BASE_URL=https://tingting.vip
            VITE_API_VERSION=/api/v1
            VITE_API_TIMEOUT=30000
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

  # ──────────────────────────────────────────────────────────
  # Job 8: Deploy to Production
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    needs: [docker-backend, docker-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Uncomment to require approval before deploying:
    # environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: tingting.vip
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail

            echo "=== Deploying Payroll ==="
            cd /opt/payroll

            echo "Pulling latest images..."
            docker compose pull frontend backend

            # --- Deploy Backend ---
            echo "Restarting backend..."
            docker compose up -d --force-recreate --no-deps backend

            echo "Waiting for backend health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/healthz >/dev/null 2>&1; then
                echo "✅ Backend healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Backend failed to start within 30s"
                docker compose logs --tail=50 backend
                exit 1
              fi
              sleep 1
            done

            # --- Deploy Frontend ---
            echo "Restarting frontend..."
            docker compose up -d --force-recreate --no-deps frontend

            echo "Waiting for frontend health check..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:3000 >/dev/null 2>&1; then
                echo "✅ Frontend healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Frontend failed to start within 15s"
                docker compose logs --tail=50 frontend
                exit 1
              fi
              sleep 1
            done

            echo "Cleaning up unused images..."
            docker image prune -f

            echo "=== Deployment complete! ==="
            echo "App: https://tingting.vip"
            echo "API: https://tingting.vip/api/healthz"
