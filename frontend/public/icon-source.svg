<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9150"/>
      <stop offset="0.55" stop-color="#08783e"/>
      <stop offset="1" stop-color="#066534"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed brand background -->
  <rect width="512" height="512" fill="url(#g)"/>
  <rect width="512" height="512" fill="url(#hl)"/>

  <!-- TT monogram -->
  <g fill="#ffffff">
    <text x="244" y="368"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="290"
      font-weight="bold"
      text-anchor="middle">T</text>
    <text x="292" y="392"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="250"
      font-weight="bold"
      text-anchor="middle">T</text>
  </g>
