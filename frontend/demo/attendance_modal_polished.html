<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thêm chấm công — Polished</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font: 'Geist', system-ui, sans-serif;
  --bg-page:     #F2F3F5;
  --bg-card:     #FFFFFF;
  --bg-header:   #FAFBFC;
  --bg-row-sat:  #FFFBF0;
  --bg-row-sun:  #FFF5F5;
  --bg-row-hover:#F8F9FB;

  --border:      #E4E6EB;
  --border-soft: #ECEEF2;

  --text-primary:   #111827;
  --text-secondary: #5A6478;
  --text-muted:     #96A0B5;

  --blue:        #2563EB;
  --blue-light:  #EEF3FD;
  --blue-mid:    #DBEAFE;
  --green:       #16A34A;
  --green-light: #F0FDF4;
  --sat-color:   #B45309;
  --sat-bg:      #FEF3C7;
  --sun-color:   #B91C1C;
  --sun-bg:      #FEE2E2;
  --wd-color:    #374151;
  --wd-bg:       #F1F5F9;

  --radius-sm:  4px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-xl:  16px;

  --shadow-card: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.18), 0 4px 16px rgba(0,0,0,.08);
}

body {
  font-family: var(--font);
  background: #DDE1E7;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px 64px;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* ── Modal shell ── */
.modal {
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 1100px;
  box-shadow: var(--shadow-modal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 64px);
}

/* ── Header ── */
.modal-header {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--bg-header);
  flex-shrink: 0;
}

.header-title {
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  border-right: 1px solid var(--border);
  white-space: nowrap;
  height: 44px;
}

.filter-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 14px;
  height: 44px;
  font-size: 12px;
  color: var(--text-secondary);
  border-right: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  transition: background 0.12s;
}
.filter-pill:hover { background: var(--bg-row-hover); }
.filter-pill svg { opacity: 0.5; flex-shrink: 0; }

.date-filter {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  height: 44px;
  font-size: 12px;
  color: var(--text-secondary);
  border-right: 1px solid var(--border);
}
.date-filter svg { color: var(--blue); flex-shrink: 0; }
.date-range { font-size: 12px; font-weight: 500; color: var(--text-primary); }

.header-spacer { flex: 1; }

.close-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  cursor: pointer;
  color: var(--text-muted);
  border-left: 1px solid var(--border);
  transition: background 0.12s, color 0.12s;
  flex-shrink: 0;
}
.close-btn:hover { background: var(--bg-row-hover); color: var(--text-primary); }

/* ── Body ── */
.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px 20px;
  background: var(--bg-page);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  align-items: start;
}

/* ── Employee card ── */
.emp-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.emp-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-soft);
  background: var(--bg-header);
  cursor: pointer;
  user-select: none;
  transition: background 0.12s;
}
.emp-header:hover { background: #F4F5F8; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.avatar-blue  { background: var(--blue-mid); color: #1D4ED8; }
.avatar-green { background: #DCFCE7; color: #15803D; }
.avatar-amber { background: #FEF3C7; color: #B45309; }
.avatar-rose  { background: #FFE4E6; color: #BE123C; }

.emp-info { flex: 1; min-width: 0; }
.emp-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.emp-phone {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

.emp-stats {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.stat-item {
  text-align: right;
}
.stat-val {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.stat-lbl {
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1;
  margin-top: 2px;
}

.stat-sep {
  width: 1px;
  height: 24px;
  background: var(--border);
}

.chevron-btn {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-muted);
  margin-left: 2px;
}
.chevron-btn svg {
  transition: transform 0.2s;
}
.chevron-btn.collapsed svg { transform: rotate(-90deg); }

/* ── Table ── */
.emp-table {}

.table-head {
  display: grid;
  grid-template-columns: 80px 140px 1fr;
  padding: 6px 14px;
  background: var(--bg-page);
  border-bottom: 1px solid var(--border-soft);
}
.table-head span {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.day-row {
  display: grid;
  grid-template-columns: 80px 140px 1fr;
  align-items: center;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.1s;
  min-height: 40px;
}
.day-row:last-child { border-bottom: none; }
.day-row:hover { background: var(--bg-row-hover); }
.day-row.sat { background: var(--bg-row-sat); }
.day-row.sun { background: var(--bg-row-sun); }
.day-row.sat:hover { background: #FFF7E0; }
.day-row.sun:hover { background: #FFEDED; }

.day-cell {
  display: flex;
  align-items: center;
  gap: 6px;
}
.day-num {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  min-width: 28px;
}
.day-num.sat { color: var(--sat-color); }
.day-num.sun { color: var(--sun-color); }

.day-badge {
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 99px;
  line-height: 1;
  letter-spacing: 0.02em;
}
.badge-wd  { background: var(--wd-bg);  color: var(--wd-color); }
.badge-sat { background: var(--sat-bg); color: var(--sat-color); }
.badge-sun { background: var(--sun-bg); color: var(--sun-color); }

/* ── Day type selector ── */
.day-type-wrap {
  position: relative;
  display: inline-flex;
}
.day-type-select {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 26px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 11.5px;
  color: var(--text-secondary);
  font-family: var(--font);
  background: var(--bg-card);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
  min-width: 120px;
}
.day-type-select:hover { border-color: #BBBFC9; }
.day-type-select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

.select-chevron {
  position: absolute;
  right: 7px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--text-muted);
}

/* ── Hour inputs ── */
.hours-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.hour-field {
  display: flex;
  align-items: center;
  gap: 4px;
}
.hour-label {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  user-select: none;
}
.hour-input {
  width: 42px;
  height: 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: var(--font);
  text-align: center;
  color: var(--text-primary);
  background: var(--bg-card);
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
  -moz-appearance: textfield;
  appearance: textfield;
  font-variant-numeric: tabular-nums;
  caret-color: var(--blue);
}
.hour-input::-webkit-inner-spin-button,
.hour-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.hour-input::placeholder { color: var(--text-muted); }
.hour-input:hover { border-color: #BBBFC9; }
.hour-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); background: #FAFCFF; }
.hour-input.has-value {
  color: #15803D;
  font-weight: 600;
  border-color: #BBF7D0;
  background: var(--green-light);
}

.hour-sep {
  width: 1px;
  height: 14px;
  background: var(--border);
  flex-shrink: 0;
}

/* ── Footer ── */
.modal-footer {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-header);
  gap: 10px;
  flex-shrink: 0;
}

.footer-legend {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: 1;
}

.fstat {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: baseline;
  gap: 3px;
}
.fstat strong {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
}
.fstat .amount {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--green);
}

.fstat-dot { color: var(--text-muted); font-size: 10px; }

.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: var(--radius-md);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  font-family: var(--font);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background 0.12s, box-shadow 0.12s, transform 0.08s;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.btn:active { transform: scale(0.98); }

.btn-cancel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.btn-cancel:hover { background: var(--bg-row-hover); color: var(--text-primary); }

.btn-save {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 1px 3px rgba(37,99,235,.3), 0 1px 2px rgba(37,99,235,.2);
}
.btn-save:hover {
  background: #1D4ED8;
  box-shadow: 0 2px 6px rgba(37,99,235,.35);
}

/* Scrollbar */
.modal-body::-webkit-scrollbar { width: 6px; }
.modal-body::-webkit-scrollbar-track { background: transparent; }
.modal-body::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 99px; }
.modal-body::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
</style>
</head>
<body>

<div class="modal">

  <!-- Header -->
  <div class="modal-header">
    <div class="header-title">Thêm chấm công</div>

    <div class="filter-pill">
      PQC Nam Định PX002
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="filter-pill">
      Tất cả nhân viên
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="date-filter">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 1.5v2M9.5 1.5v2M1.5 5.5h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="date-range">08/05/2026 — 14/05/2026</span>
    </div>

    <div class="header-spacer"></div>

    <div class="close-btn" onclick="window.close?.()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <div class="footer-legend">
      <span class="fstat"><strong id="empCount">0</strong> nhân viên</span>
      <span class="fstat-dot">·</span>
      <span class="fstat"><strong id="totalHrs">0h</strong> tổng giờ</span>
      <span class="fstat-dot">·</span>
      <span class="fstat"><span class="amount" id="totalAmt">0 đ</span></span>
    </div>
    <button class="btn btn-cancel">Hủy</button>
    <button class="btn btn-save">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 7l3.5 3.5L11 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Lưu chấm công
    </button>
  </div>
</div>

<script>
const DAYS = [
  { date: '08/05', key: 'T6', type: 'wd' },
  { date: '09/05', key: 'T7', type: 'sat' },
  { date: '10/05', key: 'CN', type: 'sun' },
  { date: '11/05', key: 'T2', type: 'wd' },
  { date: '12/05', key: 'T3', type: 'wd' },
  { date: '13/05', key: 'T4', type: 'wd' },
  { date: '14/05', key: 'T5', type: 'wd' },
];

const EMPLOYEES = [
  { id: 1, name: 'Trần Thúy An',   phone: '036300002454', initials: 'TA', avatarClass: 'avatar-blue' },
  { id: 2, name: 'Lương Thị Thúy', phone: '036189000301', initials: 'LT', avatarClass: 'avatar-green' },
  { id: 3, name: 'Hoàng Thị Nga',  phone: '036190008423', initials: 'HN', avatarClass: 'avatar-amber' },
  { id: 4, name: 'Trần Thị Điểm',  phone: '094191009217', initials: 'TĐ', avatarClass: 'avatar-rose' },
];

const HOUR_RATE = 45000;
const HOUR_TYPES = ['ca ngày', 'ca đêm', 'tăng ca'];
const DAY_TYPES = ['ngày thường', 'ngày lễ', 'ngày nghỉ'];

function buildCard(emp) {
  const card = document.createElement('div');
  card.className = 'emp-card';
  card.dataset.empId = emp.id;

  // Header
  const header = document.createElement('div');
  header.className = 'emp-header';
  header.innerHTML = `
    <div class="avatar ${emp.avatarClass}">${emp.initials}</div>
    <div class="emp-info">
      <div class="emp-name">${emp.name}</div>
      <div class="emp-phone">${emp.phone}</div>
    </div>
    <div class="emp-stats">
      <div class="stat-item">
        <div class="stat-val" data-days="${emp.id}">0</div>
        <div class="stat-lbl">ngày</div>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <div class="stat-val" data-hrs="${emp.id}">0h</div>
        <div class="stat-lbl">giờ</div>
      </div>
    </div>
    <div class="chevron-btn" data-chevron="${emp.id}">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  `;
  header.addEventListener('click', () => toggleCard(emp.id));
  card.appendChild(header);

  // Table
  const table = document.createElement('div');
  table.className = 'emp-table';
  table.dataset.tableFor = emp.id;

  const head = document.createElement('div');
  head.className = 'table-head';
  head.innerHTML = '<span>Ngày</span><span>Loại ngày</span><span>Ca làm việc</span>';
  table.appendChild(head);

  DAYS.forEach(day => {
    const row = document.createElement('div');
    row.className = `day-row${day.type !== 'wd' ? ' ' + day.type : ''}`;

    const numClass = day.type !== 'wd' ? ` ${day.type}` : '';
    const badgeClass = day.type === 'sat' ? 'badge-sat' : day.type === 'sun' ? 'badge-sun' : 'badge-wd';

    // Day type select options
    const opts = DAY_TYPES.map(dt => `<option value="${dt}">${dt}</option>`).join('');

    // Hour inputs
    const hourFields = HOUR_TYPES.map((ht, i) => `
      ${i > 0 ? '<div class="hour-sep"></div>' : ''}
      <div class="hour-field">
        <span class="hour-label">${ht}</span>
        <input class="hour-input" type="number" min="0" max="24" step="0.5" placeholder="0"
               data-emp="${emp.id}" oninput="onHourInput(this)" />
      </div>
    `).join('');

    row.innerHTML = `
      <div class="day-cell">
        <span class="day-num${numClass}">${day.date}</span>
        <span class="day-badge ${badgeClass}">${day.key}</span>
      </div>
      <div class="day-type-wrap">
        <select class="day-type-select">${opts}</select>
        <svg class="select-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="hours-group">${hourFields}</div>
    `;
    table.appendChild(row);
  });

  card.appendChild(table);
  return card;
}

function toggleCard(empId) {
  const table = document.querySelector(`[data-table-for="${empId}"]`);
  const chevron = document.querySelector(`[data-chevron="${empId}"]`);
  const isVisible = table.style.display !== 'none';
  table.style.display = isVisible ? 'none' : '';
  chevron.classList.toggle('collapsed', isVisible);
}

function onHourInput(input) {
  const val = parseFloat(input.value) || 0;
  input.classList.toggle('has-value', val > 0);

  const empId = input.dataset.emp;
  recalcEmployee(empId);
  recalcFooter();
}

function recalcEmployee(empId) {
  const table = document.querySelector(`[data-table-for="${empId}"]`);
  const inputs = table.querySelectorAll('.hour-input');
  let total = 0;
  inputs.forEach(inp => { total += parseFloat(inp.value) || 0; });

  // Count days with any hours
  const rows = table.querySelectorAll('.day-row');
  let workDays = 0;
  rows.forEach(row => {
    const rowInputs = row.querySelectorAll('.hour-input');
    let rowTotal = 0;
    rowInputs.forEach(inp => { rowTotal += parseFloat(inp.value) || 0; });
    if (rowTotal > 0) workDays++;
  });

  document.querySelector(`[data-days="${empId}"]`).textContent = workDays;
  document.querySelector(`[data-hrs="${empId}"]`).textContent = total > 0 ? total + 'h' : '0h';
}

function recalcFooter() {
  const allInputs = document.querySelectorAll('.hour-input');
  let totalHours = 0;
  allInputs.forEach(inp => { totalHours += parseFloat(inp.value) || 0; });

  let activeEmps = 0;
  EMPLOYEES.forEach(emp => {
    const table = document.querySelector(`[data-table-for="${emp.id}"]`);
    if (!table) return;
    const inputs = table.querySelectorAll('.hour-input');
    let sum = 0;
    inputs.forEach(i => { sum += parseFloat(i.value) || 0; });
    if (sum > 0) activeEmps++;
  });

  document.getElementById('empCount').textContent = activeEmps;
  document.getElementById('totalHrs').textContent = totalHours > 0 ? totalHours + 'h' : '0h';
  const amt = totalHours * HOUR_RATE;
  document.getElementById('totalAmt').textContent = amt > 0
    ? new Intl.NumberFormat('vi-VN').format(amt) + ' đ'
    : '0 đ';
}

// Build cards
const grid = document.getElementById('cardGrid');
EMPLOYEES.forEach(emp => grid.appendChild(buildCard(emp)));
</script>
</body>
</html>
